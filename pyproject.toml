[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linknote"
version = "0.1.3"
description = "把抖音视频 / 微信公众号文章转成有来源、可复核的 Markdown 笔记"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "linknote contributors" }]
dependencies = [
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/sanjing590888-lang/linknote"
Documentation = "https://github.com/sanjing590888-lang/linknote/blob/main/docs/USAGE.md"
Repository = "https://github.com/sanjing590888-lang/linknote"
Issues = "https://github.com/sanjing590888-lang/linknote/issues"
Changelog = "https://github.com/sanjing590888-lang/linknote/blob/main/RELEASE_NOTES.md"

[project.optional-dependencies]
# 抖音适配器需要真实浏览器（平台接口有签名校验，纯 HTTP 拿不到数据）
douyin = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
linknote = "linknote.cli:main"

[tool.setuptools.packages.find]
include = ["linknote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

